# Milo voice clone — spec §8, following Milo v8. FULL SFT, not LoRA (Milo's most
# important lesson). Trains on cloud H100, ~4-6 h.
# --- verbatim from docs/twin_build_spec_v2.md §8 ---
model_name_or_path: Qwen/Qwen3-TTS-12Hz-1.7B
finetuning_type: full         # not lora
learning_rate: 2.0e-5         # Milo v8
num_train_epochs: 25          # early-stop expected by epoch 5-8
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
bf16: true
save_strategy: epoch
early_stopping_patience: 3
early_stopping_threshold: 0.01

# --- harness additions (required to run; not part of spec §8) ---
stage: sft
do_train: true
flash_attn: sdpa              # SDPA everywhere on Blackwell; RTF target < 1.0x
dataset_dir: /workspace/corpus/audio   # (audio_path, transcript) pairs from whisperx
cutoff_len: 2048
output_dir: /workspace/out/voice-v1
logging_steps: 10
# Target: summed loss ~10 (avg ~0.65/codec layer), matching Milo's v8 run.
