[project]
name = "abhi-twin"
version = "0.1.0"
description = "Personal digital twin harness for a single DGX Spark (GB10)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Full cleaning pipeline on mac/spark. Presidio is MANDATORY for a real corpus
# build (privacy constraint); unit tests exercise the regex fallback so
# `make test-local` stays light.
corpus = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[project.scripts]
twin = "cli.twin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "cli",
    "ci",
    "corpus",
    "corpus.pipeline",
    "corpus.extractors",
    "serving",
    "serving.orchestrator",
    "serving.soul",
    "serving.rag",
    "serving.tts",
    "serving.stt",
    "serving.video",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
